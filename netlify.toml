# Bite More — Netlify configuration

[build]
  publish = "."

# Clean URLs: /menu instead of /menu.html
[[redirects]]
  from = "/menu.html"
  to = "/menu"
  status = 301
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Never let build scripts or configs be served
[[redirects]]
  from = "/v2_*"
  to = "/404.html"
  status = 404

# ---------------------------------------------------------------
# 301 MAP — old bitemore.us URLs → new equivalents.
# Activate when bitemore.us is pointed at Netlify.
# ---------------------------------------------------------------
[[redirects]]
  from = "/location-buckhead"
  to = "/buckhead"
  status = 301

[[redirects]]
  from = "/location-duluth"
  to = "/duluth"
  status = 301

[[redirects]]
  from = "/our-menu"
  to = "/menu"
  status = 301

[[redirects]]
  from = "/gallery"
  to = "/menu"
  status = 301

[[redirects]]
  from = "/join-our-team"
  to = "/careers"
  status = 301

[[redirects]]
  from = "/gift-card"
  to = "/gift-cards"
  status = 301

# Consolidated doorway pages
[[redirects]]
  from = "/best-wings-buckhead"
  to = "/wings-to-go"
  status = 301

[[redirects]]
  from = "/dinner-buckhead"
  to = "/buckhead"
  status = 301

# ---------------------------------------------------------------
# DOMAIN CONSOLIDATION — activate AFTER bitemore.us is attached.
# Prevents the netlify.app copy competing with production in the index.
# Uncomment both blocks once DNS resolves:
#
# [[redirects]]
#   from = "https://bite-more.netlify.app/*"
#   to = "https://bitemore.us/:splat"
#   status = 301
#   force = true
#
# [[redirects]]
#   from = "https://www.bitemore.us/*"
#   to = "https://bitemore.us/:splat"
#   status = 301
#   force = true
#
# Simpler alternative: set bitemore.us as the PRIMARY DOMAIN in
# Netlify (Domain management → Options → Set as primary domain).
# Netlify then 301s all other hostnames automatically.
# ---------------------------------------------------------------
